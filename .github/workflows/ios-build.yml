name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate source configuration
        run: |
          plutil -lint DoomScroll/Info.plist DoomScrollBroadcast/Info.plist
          if grep -R -E 'import (FamilyControls|ManagedSettings|DeviceActivity|NetworkExtension)' DoomScroll DoomScrollBroadcast; then
            echo "Paid-capability dependency found"
            exit 1
          fi
          if find DoomScroll DoomScrollBroadcast -name '*.entitlements' | grep -q .; then
            echo "Unexpected entitlements file in free-account prototype"
            exit 1
          fi

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project DoomScroll.xcodeproj \
            -scheme DoomScroll \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Verify embedded broadcast extension
        run: python3 scripts/verify_bundle.py build/DerivedData/Build/Products/Release-iphoneos/DoomScroll.app

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/package/Payload
          ditto build/DerivedData/Build/Products/Release-iphoneos/DoomScroll.app build/package/Payload/DoomScroll.app
          cd build/package
          zip -r ../DoomScroll-unsigned.ipa Payload

      - name: Verify packaged IPA
        run: |
          set -euo pipefail
          unzip -q build/DoomScroll-unsigned.ipa -d build/ipa-verification
          python3 scripts/verify_bundle.py build/ipa-verification/Payload/DoomScroll.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoomScroll-unsigned-ipa
          path: build/DoomScroll-unsigned.ipa
          if-no-files-found: error
