name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show schemes
        run: xcodebuild -project DoomScroll.xcodeproj -list

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project DoomScroll.xcodeproj \
            -scheme DoomScroll \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r DoomScroll-unsigned.ipa Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoomScroll-unsigned-ipa
          path: DoomScroll-unsigned.ipa
