name: DoomScroll
options:
  bundleIdPrefix: com.paritosh404
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.paritosh404.doomscroll
    CODE_SIGN_STYLE: Automatic

targets:
  DoomScroll:
    type: application
    platform: iOS
    sources:
      - path: DoomScroll
    settings:
      base:
        INFOPLIST_FILE: DoomScroll/Info.plist
        CODE_SIGN_ENTITLEMENTS: DoomScroll/DoomScroll.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: DoomScroll/DoomScroll.entitlements
    info:
      path: DoomScroll/Info.plist
      properties:
        CFBundleDisplayName: DoomScroll
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
