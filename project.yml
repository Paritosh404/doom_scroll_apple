name: DoomScroll
options:
  bundleIdPrefix: com.paritosh404
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: ""
    MARKETING_VERSION: "0.5.2"
    CURRENT_PROJECT_VERSION: "7"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  DoomScroll:
    type: application
    platform: iOS
    sources:
      - path: DoomScroll
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paritosh404.doomscroll
        INFOPLIST_FILE: DoomScroll/Info.plist
        GENERATE_INFOPLIST_FILE: NO
schemes:
  DoomScroll:
    build:
      targets:
        DoomScroll: all
    run:
      config: Debug
    archive:
      config: Release
